[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "voxtype-config"
version = "0.2.3"
description = "Graphical editor (GTK4/libadwaita) for the VoxType configuration file"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "tomlkit>=0.11",
    # PyGObject + GTK4 + libadwaita are provided by the system (apt),
    # pas par PyPI. Voir install.sh.
]

[project.scripts]
voxtype-config = "voxtype_config.app:main"

[tool.setuptools]
packages = ["voxtype_config"]
